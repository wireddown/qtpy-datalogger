name: 'Docs: Build and Publish'

on:
  workflow_dispatch:
    inputs:
      force_publish_override:
        description: 'Publish the documentation from this run'
        required: false
        type: boolean
  release:
    types: [ published ]

jobs:
  build:
    name: Build documentation site
    runs-on: windows-latest
    steps:
    - name: Get source code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Install poetry
      run: |
        echo '# :books: Build docs _(run ${{ github.run_number }} attempt ${{ github.run_attempt }})_' >> $env:GITHUB_STEP_SUMMARY
        pipx install poetry
        pipx environment --value PIPX_HOME
        poetry about
        poetry config --list

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.11'
        cache: poetry

    - name: Install dependencies
      run: |
        poetry self add 'poethepoet[poetry_plugin]'
        poetry install
        echo '## :package: Installed plugins and dependencies' >> $env:GITHUB_STEP_SUMMARY
        echo '```' >> $env:GITHUB_STEP_SUMMARY
        poetry self show plugins >> $env:GITHUB_STEP_SUMMARY
        poetry show >> $env:GITHUB_STEP_SUMMARY
        echo '```' >> $env:GITHUB_STEP_SUMMARY

    - name: Build documentation
      run: poetry run zensical build --clean

    - name: Upload site artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: site/

  publish:
    name: Publish to Pages
    if: github.event_name == 'release' || inputs.force_publish_override
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
        pages: write
        id-token: write
    steps:
    - name: Deploy doc site
      id: deployment
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
