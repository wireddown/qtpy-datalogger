[project]
name = "qtpy-datalogger"
version = "0.2.1"
description = "Data acquisition application using Adafruit QT Py S3"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "Apache-2.0"
authors = [
    {name = "Down to the Wire", email = "all.wired.down@gmail.com"},
]
keywords = [
    "circuitpython",
    "daq",
    "qtpy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: User Interfaces",
]
dynamic = ["dependencies"]

[project.urls]
homepage = "https://github.com/wireddown/qt-py-s3-daq-app"
source = "https://github.com/wireddown/qt-py-s3-daq-app"
changelog = "https://github.com/wireddown/qt-py-s3-daq-app/releases"
documentation = "https://github.com/wireddown/qt-py-s3-daq-app/wiki"
issues = "https://github.com/wireddown/qt-py-s3-daq-app/issues"

[project.scripts]
qtpy-datalogger = "qtpy_datalogger.__main__:main"

[tool.poetry.dependencies]
beautifulsoup4 = "^4.14.3"
circup = "^3.0.1"
click = "^8.3.2"
findimports = "^3.0.0"
gmqtt = "^0.7.0"
matplotlib = "^3.10.8"
packaging = "^26.0"
pandas = "^3.0.2"
psutil = "^7.2.2"
pyserial = "^3.5"
python = "^3.11"
tkfontawesome = "^0.3.2"
ttkbootstrap = "^1.20.2"
wmi = "^1.5.1"

[tool.poetry.group.circup.dependencies]
circuitpython-stubs = "==9.2.1"
adafruit-circuitpython-adxl37x = "^1.2.4"
adafruit-circuitpython-connectionmanager = "^3.1.4"
adafruit-circuitpython-minimqtt = "^8.0.0"
adafruit-circuitpython-neopixel = "^6.3.16"

[tool.poetry.group.dev.dependencies]
pyright = "^1.1.408"
pytest = "^9.0.2"
ruff = "^0.15.8"

[tool.poe.poetry_hooks]
pre_build = "prebuild_tasks"

[tool.poe.tasks]
_ruff_check = "ruff check"
_ruff_diff = "ruff format --diff"
_pyright = "pyright --dependencies"
_ruff_check_fix = "ruff check --fix"
_ruff_format = "ruff format"
lint.help = "Run the analyzers for the package."
lint.sequence = ["_ruff_check", "_ruff_diff", "_pyright"]
lint.ignore_fail = "return_zero"
fix.help = "Run the code formatter on the package."
fix.sequence = ["_ruff_check_fix", "_ruff_format"]
fix.ignore_fail = "return_zero"
test.help = "Run the tests for the package."
test.cmd = "pytest"
_generate_notice = "poetry run qtpy-datalogger --verbose --generate-notice ./src/qtpy_datalogger/sensor_node/snsr/notice.toml"
prebuild_tasks.sequence = ["_generate_notice"]
prebuild_tasks.help = "[automated] Run the hooks attached to 'poetry build'."

[tool.pytest]
addopts = [
    "--showlocals",
]

[tool.pyright]
venvPath = ".venv"
verboseOutput = true
exclude = [
    ".venv",
    "**/__pycache__",
    "**/.*",
    "**/node_modules",
    "docs/legacy",
]
executionEnvironments = [
    { root = "src/qtpy_datalogger/sensor_node", reportMissingModuleSource = "information", reportAttributeAccessIssue = "information" },
    { root = "." },
]

[tool.ruff]
line-length = 120
extend-exclude = [
    "docs/legacy",
]

[tool.ruff.lint]
extend-select = [
    "A",
    "ANN",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "COM",
    "D",
    "DTZ",
    "EM",
    "ERA",
    "FURB",
    "G",
    "I",
    "ICN",
    "INP",
    "ISC",
    "LOG",
    "N",
    "NPY",
    "PD",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "Q",
    "RET",
    "RUF",
    "S",
    "SIM",
    "T10",
    "T20",
    "TD",
    "TRY",
    "UP",
    "W",
]
# https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
ignore = [
    "COM812",
    "D203",
    "D211",
    "D212",
    "D400",
    "G004",
    "ISC001",
    "RET504",
    "TD002",
]

# Disable rules by path
[tool.ruff.lint.per-file-ignores]
# Tests
"tests/**.py" = [
    "INP001",       # Allow implicit namespaces
    "PLC0415",      # Allow non-toplevel imports for clarity
    "S101",         # Allow the 'assert' keyword
]
# Templates
"src/qtpy_datalogger/apps/empty.py" = [
    "F401",         # Allow unused imports for the template
]
# CircuitPython
# - Some Python libraries are not available on CircuitPython
# - Some design pattern deviations are expected
"src/qtpy_datalogger/sensor_node/**.py" = [
    "INP001",       # No __init__.py because code.py is the entry point
    "PLC0415",      # Allow non-toplevel imports to conserve memory
    "PLR2004",      # Allow "magic number" literals to conserve memory
    "PTH116",       # Path.stat() is not available
    "PTH123",       # Path.open() is not available
    "PTH208",       # Path.iterdir() is not available
    "SIM105",       # contextlib is not available
    "T201",         # Use direct IO for user REPL
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
